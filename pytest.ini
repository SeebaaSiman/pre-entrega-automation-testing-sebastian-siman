[pytest]
; Al ejecutar simplemente pytest en la terminal, el framework lee automáticamente el archivo y aplica todos los parámetros.

python_files = test_*.py
python_functions = test_*
; Las reglas python_files y python_functions aseguran que Pytest no pierda tiempo buscando pruebas en archivos que no corresponden.



addopts = -v -s --self-contained-html
; se eliminó la ruta estática --html=reports/reporte.html, dejando que conftest.py asigne la ruta dinámica
; --self-contained-html: Obliga a Pytest a incrustar todo el diseño (CSS) y scripts dentro del mismo archivo HTML